version: '3.8'

services:
  web:
    build: .
    container_name: inventory_web
    ports:
      - "8080:80"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DATABASE=stock
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: inventory_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: stock
    ports:
      - "33060:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./stock.sql:/docker-entrypoint-initdb.d/stock.sql
    restart: always

volumes:
  db_data:
